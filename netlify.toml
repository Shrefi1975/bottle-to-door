[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.16.0"
  # bun.lock is a text lockfile with bunfig settings that need Bun 1.3+;
  # pin it so Netlify never installs with an older Bun that can't read them.
  BUN_VERSION = "1.3.0"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
